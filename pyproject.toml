[project]
name = "mayday-python"
version = "1.5.4"
description = "MAYDAY Python full rebuild scaffold"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "PySide6>=6.8",
  "sounddevice>=0.5",
  "numpy>=2.0",
  "pynput>=1.8",
  "pygame>=2.6",
  "pycaw>=20240210",
  "comtypes>=1.4",
  "opuslib>=3.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["."]
